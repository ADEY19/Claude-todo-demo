<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Desk – To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16233B; --muted:#66748B; --line:#DCE2EA;
  --accent:#1F5FBF; --accent-soft:#E4EDFB; --done:#9AA6B8; --danger:#C0392B;
  --c-lit:#1F5FBF; --c-ppt:#D9822B; --c-doc:#2E8B6E; --c-write:#8A4FBF; --c-data:#C0476B; --c-other:#66748B;
  --shadow:0 1px 2px rgba(22,35,59,.06),0 8px 24px rgba(22,35,59,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#16203A; --ink:#E7ECF5; --muted:#93A1BA; --line:#26324F;
    --accent:#6FA3F5; --accent-soft:#1D2D52; --done:#5B6988; --danger:#F07C6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#16203A; --ink:#E7ECF5; --muted:#93A1BA; --line:#26324F;
  --accent:#6FA3F5; --accent-soft:#1D2D52; --done:#5B6988; --danger:#F07C6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;padding:32px 16px 64px}
.app{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:2.1rem;line-height:1.15;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1.1rem;flex:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.progress{background:var(--surface);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:.92rem;color:var(--muted)}
.progress-top strong{font-family:"Source Serif 4",Georgia,serif;font-size:1.5rem;color:var(--ink)}
.bar{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}

.composer{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px;display:grid;gap:12px}
.composer .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input[type=text],input[type=date],select,input[type=search]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.title-input{font-size:1.05rem;padding:12px 14px}
.add{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
html[data-theme="dark"] .add{color:#0E1524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add{color:#0E1524}}
.add:hover{filter:brightness(1.08)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toolbar input[type=search]{width:180px;padding:7px 12px;border-radius:99px}

ul{list-style:none;padding:0;display:grid;gap:8px}
li.task{background:var(--surface);border-radius:12px;padding:14px 14px 14px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);border-left:5px solid var(--cat,var(--c-other))}
li.task.done .t{color:var(--done);text-decoration:line-through}
li.task.done{opacity:.8}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;cursor:pointer;flex:none;margin-top:2px;display:grid;place-content:center;background:var(--bg)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.t{font-weight:500;word-break:break-word;cursor:text}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:.8rem;color:var(--muted);align-items:center}
.tag{color:var(--cat);font-weight:600}
.pri{padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pri.High{background:#FBE4E0;color:#B3261E}
.pri.Low{background:transparent;border:1px solid var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri.High{background:#4A2420;color:#FFB4AB}}
html[data-theme="dark"] .pri.High{background:#4A2420;color:#FFB4AB}
.overdue{color:var(--danger);font-weight:600}
.edit{width:100%;font-weight:500}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;border-radius:8px;width:32px;height:32px;flex:none}
.del:hover{color:var(--danger);background:var(--bg)}

.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;margin-bottom:4px}
footer{display:flex;justify-content:space-between;margin-top:16px;color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600}
@media (max-width:560px){
  .composer .row{grid-template-columns:1fr}
  .toolbar input[type=search]{width:100%}
  h1{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Research Desk</h1>
      <p class="sub" id="today"></p>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </header>

  <section class="progress" aria-label="Progress">
    <div class="progress-top"><span><strong id="pct">0%</strong> complete</span><span id="count">0 of 0 tasks done</span></div>
    <div class="bar"><div id="fill"></div></div>
  </section>

  <section class="composer" aria-label="Add a task">
    <input type="text" id="title" class="title-input" placeholder="What do you need to get done?" maxlength="200" aria-label="Task title">
    <div class="row">
      <label class="field">Category
        <select id="cat">
          <option>Literature review</option><option>Presentation</option><option>Documents</option>
          <option>Writing</option><option>Data and analysis</option><option>Other</option>
        </select>
      </label>
      <label class="field">Priority
        <select id="pri"><option>High</option><option selected>Medium</option><option>Low</option></select>
      </label>
      <label class="field">Due date
        <input type="date" id="due">
      </label>
    </div>
    <button class="add" id="add">Add task</button>
  </section>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filter tasks"></div>
    <input type="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="left"></span>
    <button class="link" id="clear">Clear completed</button>
  </footer>
</div>

<script>
(function(){
  var KEY="research-desk-tasks", THEME="research-desk-theme";
  var CATS={"Literature review":"--c-lit","Presentation":"--c-ppt","Documents":"--c-doc","Writing":"--c-write","Data and analysis":"--c-data","Other":"--c-other"};
  var PRI={High:0,Medium:1,Low:2};
  var tasks=[], filter="All", query="";
  var $=function(id){return document.getElementById(id)};

  function load(){
    try{var r=localStorage.getItem(KEY); if(r) tasks=JSON.parse(r)||[];}catch(e){tasks=[];}
    if(!tasks.length && !localStorage.getItem(KEY+"-seen")){
      tasks=[
        {id:1,title:"Search databases and shortlist 20 key papers",cat:"Literature review",pri:"High",due:"",done:false},
        {id:2,title:"Draft the outline for the conference presentation",cat:"Presentation",pri:"Medium",due:"",done:false},
        {id:3,title:"Format the reference list in the journal style",cat:"Documents",pri:"Low",due:"",done:false}
      ];
      try{localStorage.setItem(KEY+"-seen","1")}catch(e){}
    }
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function today(){var d=new Date();d.setHours(0,0,0,0);return d}
  function fmt(s){var p=s.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
  function isOver(t){if(!t.due||t.done)return false;var p=t.due.split("-");return new Date(p[0],p[1]-1,p[2])<today()}

  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

  function renderChips(){
    var names=["All","Active","Done"].concat(Object.keys(CATS));
    $("chips").innerHTML=names.map(function(n){
      return '<button class="chip" data-f="'+n+'" aria-pressed="'+(filter===n)+'">'+n+'</button>';
    }).join("");
  }

  function visible(){
    return tasks.filter(function(t){
      if(filter==="Active"&&t.done)return false;
      if(filter==="Done"&&!t.done)return false;
      if(CATS[filter]&&t.cat!==filter)return false;
      if(query&&t.title.toLowerCase().indexOf(query)<0)return false;
      return true;
    }).sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(a.due&&b.due&&a.due!==b.due)return a.due<b.due?-1:1;
      if(a.due!==b.due)return a.due?-1:1;
      return PRI[a.pri]-PRI[b.pri];
    });
  }

  function render(){
    renderChips();
    var list=visible();
    if(!list.length){
      $("list").innerHTML='<li class="empty"><strong>'+(tasks.length?"No tasks match this view":"Your desk is clear")+'</strong>'+(tasks.length?"Try another filter or clear the search.":"Add your first task above, such as reading a paper or drafting a slide.")+'</li>';
    }else{
      $("list").innerHTML=list.map(function(t){
        return '<li class="task'+(t.done?' done':'')+'" data-id="'+t.id+'" style="--cat:var('+CATS[t.cat]+')">'+
          '<input type="checkbox" class="check" aria-label="Mark complete"'+(t.done?' checked':'')+'>'+
          '<div class="body"><div class="t" title="Double-click to edit">'+esc(t.title)+'</div>'+
          '<div class="meta"><span class="tag">'+esc(t.cat)+'</span><span class="pri '+t.pri+'">'+t.pri+'</span>'+
          (t.due?'<span class="'+(isOver(t)?'overdue':'')+'">'+(isOver(t)?'Overdue: ':'Due ')+fmt(t.due)+'</span>':'')+
          '</div></div><button class="del" aria-label="Delete task">×</button></li>';
      }).join("");
    }
    var done=tasks.filter(function(t){return t.done}).length, total=tasks.length;
    var pct=total?Math.round(done/total*100):0;
    $("pct").textContent=pct+"%";
    $("fill").style.width=pct+"%";
    $("count").textContent=done+" of "+total+" tasks done";
    var left=total-done;
    $("left").textContent=left+(left===1?" task":" tasks")+" remaining";
    $("clear").style.visibility=done?"visible":"hidden";
  }

  function add(){
    var title=$("title").value.trim();
    if(!title){$("title").focus();return}
    tasks.push({id:Date.now(),title:title,cat:$("cat").value,pri:$("pri").value,due:$("due").value,done:false});
    $("title").value="";$("due").value="";
    save();render();$("title").focus();
  }

  function find(el){var li=el.closest("li.task");if(!li)return null;var id=+li.dataset.id;return tasks.filter(function(t){return t.id===id})[0]}

  $("add").addEventListener("click",add);
  $("title").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
  $("q").addEventListener("input",function(e){query=e.target.value.trim().toLowerCase();render()});
  $("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(b){filter=b.dataset.f;render()}});
  $("clear").addEventListener("click",function(){tasks=tasks.filter(function(t){return !t.done});save();render()});

  $("list").addEventListener("change",function(e){
    if(!e.target.classList.contains("check"))return;
    var t=find(e.target);if(t){t.done=e.target.checked;save();render()}
  });
  $("list").addEventListener("click",function(e){
    if(e.target.classList.contains("del")){
      var t=find(e.target);if(t){tasks=tasks.filter(function(x){return x!==t});save();render()}
    }
  });
  $("list").addEventListener("dblclick",function(e){
    var el=e.target.closest(".t");if(!el)return;
    var t=find(el);if(!t)return;
    var inp=document.createElement("input");inp.type="text";inp.className="edit";inp.value=t.title;inp.maxLength=200;
    el.replaceWith(inp);inp.focus();inp.select();
    var finished=false;
    function commit(ok){if(finished)return;finished=true;var v=inp.value.trim();if(ok&&v)t.title=v;save();render()}
    inp.addEventListener("blur",function(){commit(true)});
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")commit(true);if(ev.key==="Escape")commit(false)});
  });

  // Theme toggle
  function applyTheme(m){if(m)document.documentElement.setAttribute("data-theme",m)}
  try{applyTheme(localStorage.getItem(THEME))}catch(e){}
  $("theme").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    var next=cur==="dark"?"light":"dark";
    applyTheme(next);try{localStorage.setItem(THEME,next)}catch(e){}
  });

  $("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  load();render();
})();
</script>
</body>
</html>
